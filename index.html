<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игротека</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' fill='%231f9d6b'/%3E%3Crect x='9' width='7' height='7' fill='%23e5533d'/%3E%3Crect y='9' width='7' height='7' fill='%23f2b33d'/%3E%3Crect x='9' y='9' width='7' height='7' fill='%234c5fd5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e2629; --bg2:#123236; --panel:#18393e; --panel2:#1f4a50; --stroke:#2c5a60;
  --text:#eef5f0; --muted:#9db8b2; --accent:#f2b33d; --good:#7cf0b4; --bad:#ff8a7a;
}
*{box-sizing:border-box}
html{background-color:#0e2629}
html,body{margin:0;min-height:100%;background:#0e2629 radial-gradient(1200px 600px at 50% -10%,#1b4a4f 0%,var(--bg) 60%) fixed;color:var(--text);font-family:Nunito,system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;text-decoration:none}
.logo .tiles{display:grid;grid-template-columns:repeat(2,11px);gap:3px}
.logo .tiles i{width:11px;height:11px;border-radius:2px;display:block}
#userbox{display:flex;align-items:center;gap:8px}
.music{margin-left:auto;display:flex;align-items:center;gap:6px}
.music-btn{color:var(--muted);gap:6px}
.music-btn.on{color:var(--accent);border-color:var(--stroke)}
.music-btn .eq{display:none;align-items:flex-end;gap:2px;height:12px}
.music-btn.on .eq{display:inline-flex}
.music-btn .eq i{width:3px;background:currentColor;border-radius:1px;animation:eq 1.2s ease-in-out infinite}
.music-btn .eq i:nth-child(2){animation-delay:.3s}.music-btn .eq i:nth-child(3){animation-delay:.6s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
#musicVol{display:none;width:80px;accent-color:#f2b33d}
.music-btn.on + #musicVol{display:block}
.uname{font-weight:800;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mock{background:#5b2a7a;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px solid var(--stroke);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:#28585f}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.primary{background:var(--accent);color:#2b1d00;border-color:#d99a22}
.btn.primary:hover{background:#ffc350}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn.big{padding:13px 22px;font-size:18px}
.sel{background:var(--panel2);border:1px solid var(--stroke);border-radius:10px;padding:6px 8px;font-weight:700}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--stroke);border-radius:18px;padding:18px}
.center{text-align:center}
.narrow{max-width:560px;margin:40px auto}
.muted{color:var(--muted)} .small{font-size:13px}
h2{margin:0;font-size:20px} h3{margin:0 0 10px}

.ava{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--stroke);flex:none;font-weight:900}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.sm{width:30px;height:30px;border-radius:9px}
.ava.xs{width:22px;height:22px;border-radius:7px;font-size:12px}
.ava.lg{width:56px;height:56px;border-radius:16px;font-size:26px}
.ava .emo{font-size:1.4em;line-height:1}

/* вход */
.login{max-width:520px;margin:8vh auto 0;text-align:center}
.login h1{font-size:44px;margin:18px 0 8px}
.login p{color:#d6e4e0;line-height:1.5}
.login-art{display:grid;grid-template-columns:repeat(2,54px);gap:8px;justify-content:center}
.login-art i{width:54px;height:54px;border-radius:12px;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}

/* лобби */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.games{display:flex;flex-direction:column;gap:12px}
.game-card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--stroke);border-radius:18px;overflow:hidden}
.gc-head{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left}
.game-card.soon{opacity:.6}
.game-card.soon .gc-head{cursor:default}
.gc-ico{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--panel2);border-radius:14px;flex:none}
.gc-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.gc-t b{font-size:18px}
.gc-t small{color:var(--muted)}
.gc-meta{color:var(--muted);font-size:13px;white-space:nowrap}
.chev{transition:transform .2s;color:var(--muted)}
.game-card.open .chev{transform:rotate(180deg)}
.badge{background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;color:var(--muted)}
.gc-body{display:none;padding:0 16px 16px}
.game-card.open .gc-body{display:block}
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--stroke);border-radius:14px;margin-bottom:8px;background:rgba(0,0,0,.12)}
.trow.waiting{border-color:var(--accent);box-shadow:0 0 0 1px rgba(242,179,61,.25)}
.tname{display:flex;flex-direction:column;font-weight:900;min-width:150px}
.tname small{font-weight:700;color:var(--muted)}
.seats{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.seat{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-size:14px}
.seat.empty{background:transparent;border:1px dashed var(--stroke);color:var(--muted);padding:3px 10px}
.gc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.leaders{position:sticky;top:12px}
.lb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:transparent;border:1px solid var(--stroke);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--accent);color:#2b1d00;border-color:var(--accent)}
.lb-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--stroke)}
.lb-row.me{background:rgba(242,179,61,.1);border-radius:8px}
.rk{width:26px;text-align:center;font-weight:900}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lb-w{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.lb-w small{color:var(--muted);font-size:11px}
.mystats{margin-top:14px;font-size:13px;color:#d6e4e0;line-height:1.6}
.mystats h3{font-size:15px;margin:0 0 4px}

/* стол */
.tp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tp-head .sp{flex:1}
#tpFoot{margin-top:14px}
.seat-pair{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:10px 0 16px}
.seat-card{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.15);border:1px solid var(--stroke);border-radius:16px;padding:12px 16px;min-width:230px;text-align:left}
.seat-card b{display:block;font-size:17px}
.seat-card small{color:var(--muted)}
.seat-card.empty{border-style:dashed;opacity:.75}
.seat-card.offline{opacity:.6}
.vs{font-weight:900;color:var(--muted)}
.pick{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-weight:800}
.pick .coin-face{width:30px;height:30px}
.pick.none{color:var(--muted);font-weight:700}

/* монетка */
.coin-face{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#7a4a00;
  background:radial-gradient(circle at 35% 30%,#fff3c2,#f2c14e 45%,#c98a12 100%);box-shadow:inset 0 0 0 4px #e0a62a,inset 0 0 0 7px #fbe08a,0 4px 10px rgba(0,0,0,.35)}
.coin-face.t{background:radial-gradient(circle at 35% 30%,#ffffff,#d9dee3 45%,#8e99a3 100%);color:#3a4650;box-shadow:inset 0 0 0 4px #aab4bd,inset 0 0 0 7px #eef2f5,0 4px 10px rgba(0,0,0,.35)}
.coin-face svg{width:86%;height:86%}
.coin-pick{display:flex;gap:18px;justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
.coin-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(0,0,0,.15);border:2px solid var(--stroke);border-radius:18px;padding:14px 22px;cursor:pointer;font-weight:900;font-size:17px;transition:transform .15s,border-color .15s}
.coin-btn:hover:not(:disabled){transform:translateY(-3px);border-color:var(--accent)}
.coin-btn small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.coin-btn.chosen{border-color:var(--good);box-shadow:0 0 0 3px rgba(124,240,180,.25)}
.coin-btn.taken{opacity:.45;cursor:not-allowed}
.coin-btn:disabled{cursor:default}
.coin-overlay{position:fixed;inset:0;background:rgba(4,14,15,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;transition:opacity .35s}
.coin-overlay.hide{opacity:0}
.coin-stage{perspective:800px;height:260px;display:flex;align-items:flex-end}
.coin3d{width:150px;height:150px;position:relative;transform-style:preserve-3d}
.coin3d .side{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;color:#7a4a00;
  background:radial-gradient(circle at 35% 30%,#fff3c2,#f2c14e 45%,#c98a12 100%);box-shadow:inset 0 0 0 6px #e0a62a,inset 0 0 0 10px #fbe08a}
.coin3d .side svg{width:86%;height:86%}
.coin3d .back{transform:rotateX(180deg);color:#3a4650;background:radial-gradient(circle at 35% 30%,#fff,#d9dee3 45%,#8e99a3 100%);box-shadow:inset 0 0 0 6px #aab4bd,inset 0 0 0 10px #eef2f5}
.coin-caption{margin-top:26px;font-size:20px;text-align:center;min-height:60px;opacity:0;transition:opacity .3s}
.coin-caption b{font-size:30px;color:var(--accent)}
.coin-overlay.done .coin-caption{opacity:1}

/* итог */
.result{font-size:22px;font-weight:900;margin-bottom:12px}
.result.w{color:var(--good)} .result.l{color:var(--bad)} .result.d{color:#ffd27a}
.solo-bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap}
#soloStart:empty{display:none}
#soloStart{margin-top:14px}

/* «Цветные квадраты» */
.cs-game{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:16px;align-items:start}
.cs-side{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--stroke);border-radius:16px;padding:14px;transition:box-shadow .25s,border-color .25s,opacity .25s}
.cs-side.turn{border-color:var(--accent);box-shadow:0 0 0 2px rgba(242,179,61,.25),0 10px 30px rgba(0,0,0,.35)}
.cs-side.offline{opacity:.65}
.cs-who{display:flex;align-items:center;gap:10px}
.cs-ava{width:52px;height:52px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:30px;background:var(--panel2);border:1px solid var(--stroke);flex:none;font-weight:900}
.cs-ava img{width:100%;height:100%;object-fit:cover}
.cs-nm{font-weight:800;font-size:16px;line-height:1.15;word-break:break-word}
.cs-sub{font-size:12px;color:var(--muted)}
.cs-sw{display:flex;gap:10px}
.sw{flex:1;aspect-ratio:1/1;border-radius:12px;border:3px solid rgba(0,0,0,.35);position:relative;transition:transform .2s,box-shadow .2s,opacity .2s;opacity:.55}
.sw.on{opacity:1;transform:translateY(-2px);box-shadow:0 0 0 3px #fff,0 6px 16px rgba(0,0,0,.4)}
.sw.on::after{content:"";position:absolute;inset:18%;border-radius:6px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 3px,transparent 3px 7px)}
.cs-score{font-family:VT323,monospace;font-size:54px;line-height:1;text-align:center;letter-spacing:4px;background:#0b1f1c;color:#7cf0b4;border-radius:10px;padding:6px 4px 2px;border:2px solid #29473f;text-shadow:0 0 8px rgba(124,240,180,.55)}
.cs-side.p1 .cs-score{color:#ffc56b;text-shadow:0 0 8px rgba(255,197,107,.5)}
.cs-boardbox{background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 6px),linear-gradient(180deg,#9aa093,#80867b);border-radius:18px;padding:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 14px 40px rgba(0,0,0,.45)}
.cs-board{display:block;width:100%;height:auto;border-radius:6px;background:#27443b;touch-action:manipulation}
.reg{cursor:pointer} .reg rect{transition:fill .35s ease}
.reg.bad{cursor:not-allowed} .reg.wait{cursor:default}
.cs-turn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;min-height:28px;font-weight:800;color:#14302a;text-align:center;font-size:15px}
.cs-turn .chip{width:18px;height:18px;border-radius:5px;border:2px solid rgba(0,0,0,.35);flex:none}

/* ник и профиль */
.profile-chip{display:flex;align-items:center;gap:8px;text-decoration:none;padding:3px 10px 3px 3px;border-radius:12px;border:1px solid transparent}
.profile-chip:hover{border-color:var(--stroke);background:var(--panel2)}
.txt{width:100%;background:#0f2a2d;border:1px solid var(--stroke);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--text)}
.txt:focus{outline:2px solid var(--accent);outline-offset:1px}
.field-err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.nick-setup{max-width:440px}
.nick-setup form{margin-top:14px}
.ava.xl{width:88px;height:88px;border-radius:24px;font-size:38px}
.av-btn{position:relative;cursor:pointer;padding:0}
.av-btn .av-edit{position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:8px;background:var(--accent);color:#2b1d00;display:grid;place-items:center;font-size:14px;font-weight:900;opacity:.9}
.av-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.av-card{max-width:380px;text-align:center}
.av-stage{position:relative;margin:10px auto;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;background:#0b1f1c}
.av-stage:active{cursor:grabbing}
.av-stage canvas{display:block}
.av-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:28%;box-shadow:0 0 0 999px rgba(4,14,15,.62);outline:2px solid rgba(255,255,255,.85);pointer-events:none}
.av-zoom{display:flex;align-items:center;gap:8px;justify-content:center}
.av-zoom input{flex:1;max-width:220px;accent-color:#f2b33d}
.av-prev{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px}
.av-prev canvas{border-radius:16px;border:1px solid var(--stroke)}
.profile{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.profile .tp-head{margin-bottom:0}
.prof-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prof-nick{font-size:24px;font-weight:900}
.prof-row{margin-top:12px}
.prof-row label{display:block;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:6px}
.row-in{display:flex;gap:8px;align-items:center}
.uid{background:#0b1f1c;border:1px solid var(--stroke);border-radius:10px;padding:8px 10px;font-size:13px;word-break:break-all;flex:1}
.panel.danger{border-color:#6b2d2a}
.danger-btn{background:#7a2b22;border-color:#a33}
.danger-btn:hover{background:#963428}

/* окна */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#0b1f1c;border:1px solid var(--stroke);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(4,14,15,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:70}
.modal.show{display:flex}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--stroke);border-radius:18px;padding:20px 22px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.card li,.card p{line-height:1.5;color:#d6e4e0}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

@media (max-width:900px){
  .lobby{grid-template-columns:1fr}
  .leaders{position:static}
}
@media (max-width:820px){
  .cs-game{grid-template-columns:1fr 1fr}
  .cs-boardcol{grid-column:1 / -1;order:3}
  .cs-side{padding:10px;gap:8px}
  .cs-ava{width:40px;height:40px;font-size:22px}
  .cs-score{font-size:40px}
  .cs-sw .sw{aspect-ratio:auto;height:34px}
  .sw.on::after{inset:20% 30%}
  .trow{flex-wrap:wrap}
  .tname{min-width:0;flex:1}
  .seats{order:3;flex-basis:100%}
  .gc-meta{display:none}
  .uname{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="logo" href="#/"><span class="tiles"><i style="background:#1f9d6b"></i><i style="background:#e5533d"></i><i style="background:#f2b33d"></i><i style="background:#4c5fd5"></i></span>Игротека</a>
    <span class="mock" id="mockBadge" hidden>тестовый режим</span>
    <div class="music"><button class="btn ghost sm music-btn" id="musicBtn" aria-label="Музыка" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 18.5a2.5 2.5 0 1 1-2-2.45V5.2l11-2.2v12.5a2.5 2.5 0 1 1-2-2.45V7.3l-7 1.4z"/></svg>
      <span class="eq"><i></i><i></i><i></i></span></button>
      <input type="range" id="musicVol" min="0.05" max="1" step="0.05" aria-label="Громкость музыки"></div>
    <div id="userbox"></div>
  </div>
  <main id="main"><div class="panel center narrow">Загрузка…</div></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><div id="modalBody"></div><div class="row"><button class="btn primary" id="modalClose">Понятно</button></div></div></div>
<div class="modal" id="confirm"><div class="card"><h2 id="cfTitle"></h2><p id="cfText"></p>
  <div class="row"><button class="btn" id="cfNo">Отмена</button><button class="btn primary" id="cfYes">Да</button></div></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
